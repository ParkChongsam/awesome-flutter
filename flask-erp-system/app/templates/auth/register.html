{% extends "base.html" %}

{% block title %}회원가입 (Register){% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 align-items-center">
        <div class="col-md-6 col-lg-5 mx-auto">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                        <h3>회원가입</h3>
                        <p class="text-muted">Register New Account</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">사용자명 (Username) *</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">이메일 (Email) *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="full_name" class="form-label">전체 이름 (Full Name)</label>
                            <input type="text" class="form-control" id="full_name" name="full_name">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호 (Password) *</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <small class="form-text text-muted">최소 8자 이상</small>
                        </div>

                        <div class="mb-3">
                            <label for="password_confirm" class="form-label">비밀번호 확인 (Confirm Password) *</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-plus"></i> 회원가입
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted">
                            이미 계정이 있으신가요?
                            <a href="{{ url_for('auth.login') }}">로그인</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
