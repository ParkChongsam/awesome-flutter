{% extends "base.html" %}

{% block title %}로그인 (Login){% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 align-items-center">
        <div class="col-md-6 col-lg-4 mx-auto">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-copy fa-3x text-primary mb-3"></i>
                        <h3>{{ company_name }}</h3>
                        <p class="text-muted">ERP 시스템 로그인</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> 사용자명 (Username)
                            </label>
                            <input type="text" class="form-control" id="username" name="username"
                                   required autofocus placeholder="사용자명을 입력하세요">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> 비밀번호 (Password)
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required placeholder="비밀번호를 입력하세요">
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">
                                로그인 상태 유지 (Remember me)
                            </label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> 로그인
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted">
                            계정이 없으신가요?
                            <a href="{{ url_for('auth.register') }}">회원가입</a>
                        </p>
                    </div>

                    <div class="alert alert-info mt-4" role="alert">
                        <small>
                            <strong>기본 관리자 계정:</strong><br>
                            Username: admin<br>
                            Password: admin123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
